# Smoke-test CI gate for the zeeker resource collection.
#
# Runs the whole offline suite in tests/: tests/test_smoke.py (imports every
# resources/*.py module and asserts the entry points zeeker's builder needs)
# plus parser, HTTP/retry, LLM-stub and row-shape tests built on saved fixtures
# in tests/fixtures/. No network I/O (enforced by tests/conftest.py), so it
# runs on every push to main and every PR, including Dependabot bumps.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Pin Python rather than using the runner's system interpreter, which
      # changes under us (ubuntu-latest moved to 3.14 in Nov 2026). 3.12
      # matches requires-python and the repo's sync/deploy workflows.
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      - name: Run smoke tests
        run: uv run pytest -v